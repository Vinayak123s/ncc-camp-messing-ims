function toggleModuleGroup(btn,id){
  const el=document.getElementById(id);if(!el)return; const open=el.classList.toggle('open');
  const a=btn.querySelector('.group-arrow'); if(a)a.textContent=open?'▾':'▸';
  if(side.classList.contains('expanded')) return;
}
function setPOLTab(tab){
  document.querySelectorAll('[data-poltab]').forEach(b=>b.classList.toggle('active',b.dataset.poltab===tab));
  const map={vehicle:'polVehicleSection',drawn:'polDrawnSection',diary:'polDiarySection',report:'polReportSection'};
  Object.entries(map).forEach(([k,id])=>document.getElementById(id)?.classList.toggle('hidden',k!==tab));
  if(tab==='vehicle')renderPOLVehicleRegister();
  if(tab==='drawn'){renderPOL();loadPOLVehicleSelect()}
  if(tab==='diary'){loadDiaryVehicle();renderCarDiaryRegister()}
  if(tab==='report'){renderPOLReport()}
}
function renderPOLVehicleRegister(){
  const box=document.getElementById('polVehiclesTable');if(!box)return;
  const s=(document.getElementById('polVehicleSearch')?.value||'').toLowerCase(), tf=document.getElementById('polVehicleTypeFilter')?.value||'', ff=document.getElementById('polFuelFilter')?.value||'';
  const rows=polVehicles.filter(v=>(!s||[v.vehicle_no,v.driver_name,v.unit].join(' ').toLowerCase().includes(s))&&(!tf||v.vehicle_type===tf)&&(!ff||(v.fuel_type||'')===ff));
  let h='<table><tr><th>SL No</th><th>Vehicle Type</th><th>Vehicle No.</th><th>Fuel Type</th><th>Tank Balance</th><th>KPL</th><th>Driver</th><th>Attached From</th><th>Attached To</th><th>Status</th><th>Action</th></tr>';
  rows.forEach((v,i)=>{h+=`<tr><td>${i+1}</td><td>${esc(v.vehicle_type)}</td><td><b>${esc(v.vehicle_no)}</b></td><td>${esc(v.fuel_type||'-')}</td><td>${(+v.pol_balance||0).toFixed(2)}</td><td>${(+v.kpl||0).toFixed(2)}</td><td>${esc(v.driver_name||'')}</td><td>${esc(v.attached_from||'-')}</td><td>${esc(v.attached_to||'-')}</td><td><span class="status ok">ACTIVE</span></td><td>${canQsecEntry()?`<button class="btn ghost" onclick="editPOLVehicle('${v.id}')">Edit</button>`:'View'} ${canDelete()?`<button class="btn red" onclick="deletePOLVehicle('${v.id}')">Delete</button>`:''}</td></tr>`});h+='</table>';box.innerHTML=rows.length?h:'<div class="empty">No vehicle attachment records.</div>';
  const dv=rows.filter(v=>(v.fuel_type||'')==='Diesel').length,pv=rows.filter(v=>(v.fuel_type||'')==='Petrol').length;
  ['polKpiVehicles','polKpiDiesel','polKpiPetrol'].forEach((id,val)=>{const e=document.getElementById(id);if(e)e.textContent=[rows.length,dv,pv][val]});
  const selects=['polRepVehicle','diaryVehicle','diaryReportVehicle'];selects.forEach(id=>{const e=document.getElementById(id);if(!e)return;const cur=e.value;e.innerHTML='<option value="">'+(id==='diaryReportVehicle'?'All Vehicles':'Select Vehicle')+'</option>'+polVehicles.map(v=>`<option value="${v.id}" ${v.id===cur?'selected':''}>${esc(v.vehicle_no)} - ${esc(v.vehicle_type)}</option>`).join('')});
  const badge=document.getElementById('polCampBadge');if(badge)badge.textContent=activeCamp?.camp_name||'—';
}
function exportPOLVehicleCSV(){const rows=[['SL No','Vehicle Type','Vehicle No','Fuel Type','Tank Balance','KPL','Driver','Attached From','Attached To'],...polVehicles.map((v,i)=>[i+1,v.vehicle_type,v.vehicle_no,v.fuel_type||'',v.pol_balance||0,v.kpl||'',v.driver_name||'',v.attached_from||'',v.attached_to||''])];downloadCSV(rows,'POL_Vehicle_Attachment.csv')}
function printPOLVehicleReport(){setPOLTab('vehicle');window.print()}
function printPOLDrawnReport(){setPOLTab('drawn');window.print()}

// Enhanced vehicle save/edit payload while retaining legacy database columns.
const _oldSavePOLVehicle=savePOLVehicle;
async function savePOLVehicle(){
  if(!canQsecEntry()){setMsg('polVehMsg','No entry permission for this role.');return}
  if(!activeCamp){setMsg('polVehMsg','Select a camp first.');return}
  const payload={camp_id:activeCamp.id,vehicle_no:document.getElementById('polVehNo').value.trim().toUpperCase(),unit:document.getElementById('polUnit').value.trim(),vehicle_type:document.getElementById('polVehType').value,km_reading:+document.getElementById('polKM').value||0,pol_balance:+document.getElementById('polBal').value||0,kpl:+document.getElementById('polKPL').value||0,driver_name:document.getElementById('polDriver').value.trim(),authority_no:document.getElementById('polAuth').value.trim(),fuel_type:document.getElementById('polFuelType').value,make_model:document.getElementById('polMakeModel').value.trim(),year_mfg:document.getElementById('polYearMfg').value.trim(),attached_from:document.getElementById('polAttachedFrom').value||null,attached_to:document.getElementById('polAttachedTo').value||null,driver_contact:document.getElementById('polDriverContact').value.trim()};
  if(!payload.vehicle_no||!payload.unit||!payload.vehicle_type||payload.kpl<=0||!payload.driver_name||!payload.authority_no){setMsg('polVehMsg','Fill all required vehicle fields.');return}
  let q;
  const existing=polVehicles.find(v=>v.vehicle_no===payload.vehicle_no);
  if(existing) q=sb.from('pol_vehicles').update(payload).eq('id',existing.id).eq('camp_id',activeCamp.id); else q=sb.from('pol_vehicles').insert(payload);
  const {error}=await q;if(error){setMsg('polVehMsg',error.message);return}
  setMsg('polVehMsg','Vehicle saved.',true);clearPOLVehicle();await refreshAll();setPOLTab('vehicle');
}
function clearPOLVehicle(){['polVehNo','polUnit','polVehType','polKPL','polDriver','polAuth','polMakeModel','polYearMfg','polAttachedFrom','polAttachedTo','polDriverContact','polKM'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});if(document.getElementById('polFuelType'))document.getElementById('polFuelType').value='Diesel';setMsg('polVehMsg','')}
function editPOLVehicle(id){const v=polVehicles.find(x=>x.id===id);if(!v)return;['polVehNo','polUnit','polVehType','polKPL','polDriver','polAuth','polMakeModel','polYearMfg','polAttachedFrom','polAttachedTo','polDriverContact','polKM'].forEach(id=>{const key={polVehNo:'vehicle_no',polUnit:'unit',polVehType:'vehicle_type',polKPL:'kpl',polDriver:'driver_name',polAuth:'authority_no',polMakeModel:'make_model',polYearMfg:'year_mfg',polAttachedFrom:'attached_from',polAttachedTo:'attached_to',polDriverContact:'driver_contact',polKM:'km_reading'}[id];const e=document.getElementById(id);if(e)e.value=v[key]??''});if(document.getElementById('polFuelType'))document.getElementById('polFuelType').value=v.fuel_type||'Diesel';setPOLTab('vehicle');window.scrollTo({top:0,behavior:'smooth'})}

async function loadCarDiary(){
  if(!activeCamp){window.carDiaryEntries=[];renderCarDiaryRegister();return}
  const {data,error}=await sb.from('pol_car_diary').select('*').eq('camp_id',activeCamp.id).order('entry_date',{ascending:false}).order('created_at',{ascending:false});
  if(error){console.warn(error);window.carDiaryEntries=[]}else window.carDiaryEntries=data||[];
  renderCarDiaryRegister();
}
function loadDiaryVehicle(){const id=document.getElementById('diaryVehicle')?.value;if(!id)return;const v=polVehicles.find(x=>x.id===id);if(!v)return;const last=(window.carDiaryEntries||[]).find(x=>x.vehicle_id===id);document.getElementById('diaryOpeningKm').value=last?last.closing_km:(v.km_reading||0);document.getElementById('diaryKpl').value=(+v.kpl||0).toFixed(2);calcDiary()}
function calcDiary(){const o=+document.getElementById('diaryOpeningKm')?.value||0,k=+document.getElementById('diaryKmRun')?.value||0,kpl=+document.getElementById('diaryKpl')?.value||0;document.getElementById('diaryClosingKm').value=(o+k).toFixed(1);document.getElementById('diaryPolConsumed').value=kpl>0?(k/kpl).toFixed(2):'0.00'}
async function saveCarDiary(){if(!canQsecEntry()){setMsg('diaryMsg','No entry permission.');return}const vid=document.getElementById('diaryVehicle').value, v=polVehicles.find(x=>x.id===vid);if(!v){setMsg('diaryMsg','Select vehicle.');return}const km=+document.getElementById('diaryKmRun').value||0;if(km<0){setMsg('diaryMsg','KM Run must be valid.');return}const payload={camp_id:activeCamp.id,vehicle_id:vid,vehicle_no:v.vehicle_no,entry_date:document.getElementById('diaryDate').value||today(),nature_of_duty:document.getElementById('diaryNature').value,purpose_of_duty:document.getElementById('diaryPurpose').value.trim(),from_location:document.getElementById('diaryFrom').value.trim(),to_location:document.getElementById('diaryTo').value.trim(),opening_km:+document.getElementById('diaryOpeningKm').value||0,km_run:km,closing_km:+document.getElementById('diaryClosingKm').value||0,kpl:+document.getElementById('diaryKpl').value||0,pol_consumed:+document.getElementById('diaryPolConsumed').value||0,remarks:document.getElementById('diaryRemarks').value.trim()};if(!payload.purpose_of_duty||!payload.from_location||!payload.to_location){setMsg('diaryMsg','Purpose, From and To are required.');return}const {error}=await sb.from('pol_car_diary').insert(payload);if(error){setMsg('diaryMsg',error.message);return}setMsg('diaryMsg','Car diary entry saved.',true);clearCarDiary();await loadCarDiary()}
function clearCarDiary(){['diaryVehicle','diaryNature','diaryPurpose','diaryFrom','diaryTo','diaryOpeningKm','diaryKmRun','diaryClosingKm','diaryKpl','diaryPolConsumed','diaryRemarks'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});if(document.getElementById('diaryDate'))document.getElementById('diaryDate').value=today();setMsg('diaryMsg','')}
function renderCarDiaryRegister(){const el=document.getElementById('carDiaryTable');if(!el)return;let rows=[...(window.carDiaryEntries||[])];const v=document.getElementById('diaryReportVehicle')?.value||'',from=document.getElementById('diaryReportFrom')?.value||'',to=document.getElementById('diaryReportTo')?.value||'';if(v)rows=rows.filter(x=>x.vehicle_id===v);if(from)rows=rows.filter(x=>x.entry_date>=from);if(to)rows=rows.filter(x=>x.entry_date<=to);let h='<table><tr><th>Date</th><th>Vehicle</th><th>Nature</th><th>Purpose</th><th>From</th><th>To</th><th>Opening KM</th><th>KM Run</th><th>Closing KM</th><th>KPL</th><th>POL Consumed</th><th>Action</th></tr>';rows.forEach(x=>h+=`<tr><td>${esc(x.entry_date)}</td><td>${esc(x.vehicle_no)}</td><td>${esc(x.nature_of_duty)}</td><td>${esc(x.purpose_of_duty)}</td><td>${esc(x.from_location)}</td><td>${esc(x.to_location)}</td><td>${(+x.opening_km||0).toFixed(1)}</td><td>${(+x.km_run||0).toFixed(1)}</td><td>${(+x.closing_km||0).toFixed(1)}</td><td>${(+x.kpl||0).toFixed(2)}</td><td>${(+x.pol_consumed||0).toFixed(2)}</td><td>${canDelete()?`<button class="btn red" onclick="deleteCarDiary('${x.id}')">Delete</button>`:'View'}</td></tr>`);h+='</table>';el.innerHTML=rows.length?h:'<div class="empty">No car diary entries.</div>'}
async function deleteCarDiary(id){if(!canDelete())return alert('Only ADMIN/MANAGER can delete car diary entries.');if(!confirm('Delete car diary entry?'))return;const {error}=await sb.from('pol_car_diary').delete().eq('id',id).eq('camp_id',activeCamp.id);if(error)alert(error.message);else await loadCarDiary()}
function exportCarDiaryCSV(){const rows=[['Date','Vehicle','Nature','Purpose','From','To','Opening KM','KM Run','Closing KM','KPL','POL Consumed'],...(window.carDiaryEntries||[]).map(x=>[x.entry_date,x.vehicle_no,x.nature_of_duty,x.purpose_of_duty,x.from_location,x.to_location,x.opening_km,x.km_run,x.closing_km,x.kpl,x.pol_consumed])];downloadCSV(rows,'Car_Diary_Report.csv')}
function printCarDiaryReport(){setPOLTab('diary');window.print()}
function renderPOLReport(){const el=document.getElementById('polReportContent');if(!el)return;const type=document.getElementById('polRepType')?.value||'vehicle',vid=document.getElementById('polRepVehicle')?.value||'',from=document.getElementById('polRepFrom')?.value||'',to=document.getElementById('polRepTo')?.value||'';let h='';if(type==='vehicle'){let rows=polVehicles.filter(x=>!vid||x.id===vid);h='<table><tr><th>SL</th><th>Vehicle</th><th>Type</th><th>Fuel</th><th>KPL</th><th>Driver</th><th>Attached From</th><th>Attached To</th></tr>';rows.forEach((x,i)=>h+=`<tr><td>${i+1}</td><td>${esc(x.vehicle_no)}</td><td>${esc(x.vehicle_type)}</td><td>${esc(x.fuel_type||'-')}</td><td>${(+x.kpl||0).toFixed(2)}</td><td>${esc(x.driver_name)}</td><td>${esc(x.attached_from||'-')}</td><td>${esc(x.attached_to||'-')}</td></tr>`);h+='</table>'} else if(type==='drawn'){let rows=polEntries.filter(x=>(!vid||x.vehicle_id===vid)&&(!from||x.entry_date>=from)&&(!to||x.entry_date<=to));h='<table><tr><th>Date</th><th>Vehicle</th><th>Fuel</th><th>Invoice</th><th>Bunk</th><th>Prev</th><th>Drawn</th><th>Present</th><th>Rate</th><th>Amount</th></tr>';rows.forEach(x=>h+=`<tr><td>${esc(x.entry_date)}</td><td>${esc(x.vehicle_no)}</td><td>${esc(x.fuel_type)}</td><td>${esc(x.invoice_number)}</td><td>${esc(x.petrol_bunk)}</td><td>${(+x.previous_fuel||0).toFixed(2)}</td><td>${(+x.litres||0).toFixed(2)}</td><td>${(+x.present_fuel||0).toFixed(2)}</td><td>${money(x.rate)}</td><td>${money(x.total_amount)}</td></tr>`);h+='</table>'} else {renderCarDiaryRegister();h=document.getElementById('carDiaryTable')?.innerHTML||''}el.innerHTML=h||'<div class="empty">No records found.</div>'}
function exportPOLReportCSV(){const type=document.getElementById('polRepType')?.value||'vehicle';if(type==='vehicle')return exportPOLVehicleCSV();if(type==='diary')return exportCarDiaryCSV();exportPOLCSV()}
function printPOLReport(){
  renderPOLReport();
  setTimeout(()=>{
    const box=document.getElementById('polReportContent');
    const table=box?.querySelector('table');
    const rows=table?[...table.querySelectorAll('tr')].map(tr=>[...tr.cells].map(td=>td.innerText)):[];
    if(rows.length){printTableReport('POL Report',rows[0],rows.slice(1));return;}
    printTableReport('POL Report',['Message'],[['No records found.']]);
  },120);
}
function setPOLTab(tab){
  const map={vehicle:'polVehicleSection',drawn:'polDrawnSection',diary:'polDiarySection',report:'polReportSection'};
  document.querySelectorAll('[data-poltab]').forEach(b=>b.classList.toggle('active',b.dataset.poltab===tab));
  Object.values(map).forEach(id=>document.getElementById(id)?.classList.add('hidden'));
  document.getElementById(map[tab])?.classList.remove('hidden');
  if(tab==='vehicle')renderPOLVehicleRegister();
  if(tab==='drawn'){renderPOL();loadPOLVehicleSelect();}
  if(tab==='diary'){loadPOLVehicleSelect();loadCarDiary();renderCarDiaryRegister();}
  if(tab==='report'){renderPOLReport();}
}
function renderPOLVehicleRegister(){
  const box=document.getElementById('polVehiclesTable');if(!box)return;
  const q=(document.getElementById('polVehicleSearch')?.value||'').toLowerCase(), tf=document.getElementById('polVehicleTypeFilter')?.value||'', ff=document.getElementById('polFuelFilter')?.value||'';
  const rows=polVehicles.filter(v=>(!q||[v.vehicle_no,v.driver_name,v.unit].join(' ').toLowerCase().includes(q))&&(!tf||v.vehicle_type===tf)&&(!ff||v.fuel_type===ff));
  let h='<table><tr><th>SL No</th><th>Vehicle Type</th><th>Vehicle No.</th><th>Fuel Type</th><th>Tank Balance</th><th>KPL</th><th>Driver</th><th>Attached From</th><th>Attached To</th><th>Action</th></tr>';
  rows.forEach((v,i)=>h+=`<tr><td>${i+1}</td><td>${esc(v.vehicle_type)}</td><td><b>${esc(v.vehicle_no)}</b></td><td>${esc(v.fuel_type||'-')}</td><td>${(+v.pol_balance||0).toFixed(2)}</td><td>${(+v.kpl||0).toFixed(2)}</td><td>${esc(v.driver_name||'')}</td><td>${esc(v.attached_from||'-')}</td><td>${esc(v.attached_to||'-')}</td><td>${canQsecEntry()?`<button class="btn ghost" onclick="editPOLVehicle('${v.id}')">Edit</button>`:'View'} ${canDelete()?`<button class="btn red" onclick="deletePOLVehicle('${v.id}')">Delete</button>`:''}</td></tr>`);
  h+='</table>';box.innerHTML=rows.length?h:'<div class="empty">No vehicle attachment records.</div>';
  const vals=[rows.length,rows.filter(v=>v.fuel_type==='Diesel').length,rows.filter(v=>v.fuel_type==='Petrol').length];['polKpiVehicles','polKpiDiesel','polKpiPetrol'].forEach((id,i)=>{const e=document.getElementById(id);if(e)e.textContent=vals[i]});
  ['polRepVehicle','diaryVehicle','diaryReportVehicle'].forEach(id=>{const e=document.getElementById(id);if(!e)return;const cur=e.value;e.innerHTML='<option value="">'+(id==='diaryReportVehicle'?'All Vehicles':'Select Vehicle')+'</option>'+polVehicles.map(v=>`<option value="${v.id}" ${v.id===cur?'selected':''}>${esc(v.vehicle_no)} - ${esc(v.vehicle_type)}</option>`).join('')});
}
function clearPOLVehicle(){['polVehNo','polUnit','polVehType','polKPL','polDriver','polAuth','polAttachedFrom','polAttachedTo','polDriverContact','polKM','polBal'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});if(document.getElementById('polFuelType'))document.getElementById('polFuelType').value='Diesel';setMsg('polVehMsg','')}
function editPOLVehicle(id){const v=polVehicles.find(x=>String(x.id)===String(id));if(!v)return;const map={polVehNo:'vehicle_no',polUnit:'unit',polVehType:'vehicle_type',polKPL:'kpl',polDriver:'driver_name',polAuth:'authority_no',polAttachedFrom:'attached_from',polAttachedTo:'attached_to',polDriverContact:'driver_contact',polKM:'km_reading',polBal:'pol_balance'};Object.entries(map).forEach(([id,k])=>{const e=document.getElementById(id);if(e)e.value=v[k]??''});if(document.getElementById('polFuelType'))document.getElementById('polFuelType').value=v.fuel_type||'Diesel';setPOLTab('vehicle');window.scrollTo({top:0,behavior:'smooth'})}
async function savePOLVehicle(){
  if(!canQsecEntry())return setMsg('polVehMsg','No entry permission for this role.');
  if(!activeCamp)return setMsg('polVehMsg','Select an active camp first.');
  const payload={camp_id:activeCamp.id,vehicle_no:document.getElementById('polVehNo').value.trim().toUpperCase(),unit:document.getElementById('polUnit').value.trim(),vehicle_type:document.getElementById('polVehType').value,km_reading:+document.getElementById('polKM').value||0,pol_balance:+document.getElementById('polBal').value||0,kpl:+document.getElementById('polKPL').value||0,driver_name:document.getElementById('polDriver').value.trim(),authority_no:document.getElementById('polAuth').value.trim(),fuel_type:document.getElementById('polFuelType').value,attached_from:document.getElementById('polAttachedFrom').value||null,attached_to:document.getElementById('polAttachedTo').value||null,driver_contact:document.getElementById('polDriverContact').value.trim()};
  if(!payload.vehicle_no||!payload.unit||!payload.vehicle_type||payload.kpl<=0||!payload.driver_name||!payload.authority_no)return setMsg('polVehMsg','Fill Vehicle No, Unit, Vehicle Type, KPL, Driver and Authority/Remarks.');
  const existing=polVehicles.find(v=>v.vehicle_no===payload.vehicle_no); const q=existing?sb.from('pol_vehicles').update(payload).eq('id',existing.id).eq('camp_id',activeCamp.id):sb.from('pol_vehicles').insert(payload);
  const {error}=await q;if(error)return setMsg('polVehMsg',error.message); setMsg('polVehMsg','Vehicle saved successfully.',true);clearPOLVehicle();await refreshAll();setPOLTab('vehicle');
}

  const el=document.getElementById('polReportContent');if(!el)return;const type=document.getElementById('polRepType')?.value||'vehicle',vid=document.getElementById('polRepVehicle')?.value||'',from=document.getElementById('polRepFrom')?.value||'',to=document.getElementById('polRepTo')?.value||'';

/* ===== V3 FIXES: CASHBOOK HEAD ALLOCATIONS + POL CAR DIARY + VEHICLE FORM ===== */
const HEAD_CANONICAL = {
  'MESSING':'Messing','INC':'INC','POL':'POL','RANK PAY':'Rank Pay',
  'TA CADETS':'TA Cadets','TA/DA CIV STAFF':'TA/DA Civ Staff','TA/DA CIV':'TA/DA Civ Staff',
  'TA DA CIV STAFF':'TA/DA Civ Staff','RENT':'Rent','OTHERS':'Others','OTHER':'Others'
};
function canonicalHead(name){
  const raw=String(name||'').trim();
  return HEAD_CANONICAL[raw.toUpperCase()] || raw;
}
function normalizedAlloc(obj){
  const src=(obj&&typeof obj==='object')?obj:{};
  const out={Messing:0,INC:0,POL:0,'Rank Pay':0,'TA Cadets':0,'TA/DA Civ Staff':0,Rent:0,Others:0};
  Object.keys(src).forEach(k=>{const c=canonicalHead(k); if(Object.prototype.hasOwnProperty.call(out,c)) out[c]+=Number(src[k]||0);});
  return out;
}
function headFromEntry(e,head){
  const c=canonicalHead(head);
  const a=normalizedAlloc(jsonObj(e?.head_allocations));
  if(e?.entry_type==='RECEIPT') return Number(a[c]||0);
  if(e?.entry_type==='PAYMENT') return canonicalHead(e.code_head)===c ? -Number(e.amount||0) : 0;
  return 0;
}

function currentHeadBalance(head,date=today()){
  const c=canonicalHead(head); let total=0;
  (cashbookEntries||[]).filter(e=>e.entry_date<=date).forEach(e=>{total+=headFromEntry(e,c)});
  return total;
}

// Rebuild day calculations with normalized head-allocation keys.
function calculateDay(date){
  const d=date||today();
  const rows=(cashbookEntries||[]).filter(e=>e.entry_date===d);
  const before=(cashbookEntries||[]).filter(e=>e.entry_date<d);
  const sumMode=(arr,type,mode)=>arr.filter(e=>e.entry_type===type&&e.mode===mode).reduce((s,e)=>s+Number(e.amount||0),0);
  const bfCash=before.reduce((s,e)=>{if(e.entry_type==='RECEIPT'&&e.mode==='CASH')return s+Number(e.amount||0);if(e.entry_type==='PAYMENT'&&e.mode==='CASH')return s-Number(e.amount||0);if(e.entry_type==='CASH_DRAWN')return s+Number(e.amount||0);return s},0);
  const bfBank=before.reduce((s,e)=>{if(e.entry_type==='RECEIPT'&&e.mode==='BANK')return s+Number(e.amount||0);if(e.entry_type==='PAYMENT'&&e.mode==='BANK')return s-Number(e.amount||0);if(e.entry_type==='CASH_DRAWN')return s-Number(e.amount||0);return s},0);
  const rc=sumMode(rows,'RECEIPT','CASH'), rb=sumMode(rows,'RECEIPT','BANK'), pc=sumMode(rows,'PAYMENT','CASH'), pb=sumMode(rows,'PAYMENT','BANK');
  const draw=rows.filter(e=>e.entry_type==='CASH_DRAWN').reduce((s,e)=>s+Number(e.amount||0),0);
  const cfCash=bfCash+rc-pc+draw, cfBank=bfBank+rb-pb-draw;
  const closed=(cashbookDayClosures||[]).some(x=>x.close_date===d);
  const heads=['Messing','INC','POL','Rank Pay','TA Cadets','TA/DA Civ Staff','Rent','Others'];
  const bfHeads={}; const dayReceipts={}; const dayPayments={}; const cfHeads={};
  const earlierClosures=(cashbookDayClosures||[]).filter(x=>x.close_date<d).sort((a,b)=>String(b.close_date).localeCompare(String(a.close_date)));
  const prev=earlierClosures[0];
  heads.forEach(h=>{bfHeads[h]=Number(normalizedAlloc(prev?.closing_heads)[h]||0);dayReceipts[h]=0;dayPayments[h]=0;});
  rows.forEach(e=>{
    heads.forEach(h=>{
      if(e.entry_type==='RECEIPT') dayReceipts[h]+=Number(headFromEntry(e,h));
      else if(e.entry_type==='PAYMENT') dayPayments[h]+=Math.max(0,-Number(headFromEntry(e,h)));
    });
  });
  heads.forEach(h=>cfHeads[h]=bfHeads[h]+dayReceipts[h]-dayPayments[h]);
  return {bfCash,bfBank,rc,rb,pc,pb,draw,cfCash,cfBank,net:(rc+rb)-(pc+pb),closed,bfHeads,dayReceipts,dayPayments,cfHeads};
}

function polInitialKm(v){ return Number(v.initial_km_reading ?? v.km_reading ?? 0); }
function polInitialTank(v){ return Number(v.initial_tank_balance ?? v.pol_balance ?? 0); }
function polDiaryRows(vehicleId){ return (window.carDiaryEntries||[]).filter(x=>String(x.vehicle_id)===String(vehicleId)); }
function polDrawRows(vehicleId, excludeId){ return (window.polEntries||[]).filter(x=>String(x.vehicle_id)===String(vehicleId) && (!excludeId || String(x.id)!==String(excludeId))); }
function polCurrentState(vehicleId, excludeDrawId){
  const v=polVehicles.find(x=>String(x.id)===String(vehicleId));
  if(!v) return {openingKm:0,currentKm:0,kmRun:0,kpl:0,consumed:0,drawn:0,tank:0,lastDiary:null};
  const diaries=polDiaryRows(vehicleId).sort((a,b)=>String(a.entry_date).localeCompare(String(b.entry_date)) || String(a.created_at||'').localeCompare(String(b.created_at||'')));
  const draws=polDrawRows(vehicleId,excludeDrawId);
  const kmRun=diaries.reduce((s,x)=>s+Number(x.km_run||0),0);
  const consumed=diaries.reduce((s,x)=>s+Number(x.pol_consumed||0),0);
  const drawn=draws.reduce((s,x)=>s+Number(x.litres||0),0);
  const lastDiary=diaries.length?diaries[diaries.length-1]:null;
  const openingKm=polInitialKm(v);
  const currentKm=lastDiary?Number(lastDiary.closing_km||openingKm):openingKm;
  const tank=Math.max(0,polInitialTank(v)+drawn-consumed);
  return {openingKm,currentKm,kmRun, kpl:Number(v.kpl||0), consumed, drawn, tank,lastDiary};
}

const CASH_HEAD_ALIASES = {
  'MESSING':'Messing','INC':'INC','POL':'POL','RANK PAY':'Rank Pay',
  'TA CADETS':'TA Cadets','TA/DA CIV STAFF':'TA/DA Civ Staff','TA/DA CIV':'TA/DA Civ Staff',
  'TA DA CIV STAFF':'TA/DA Civ Staff','RENT':'Rent','OTHERS':'Others','OTHER':'Others'
};
function canonicalCashHead(h){ const k=String(h||'').trim().toUpperCase(); return CASH_HEAD_ALIASES[k]||String(h||'').trim(); }
function getAlloc(e){
  let v=e?.head_allocations;
  if(typeof v==='string'){try{v=JSON.parse(v)}catch(_){v={}}}
  v=v&&typeof v==='object'?v:{};
  const out={Messing:0,INC:0,POL:0,'Rank Pay':0,'TA Cadets':0,'TA/DA Civ Staff':0,Rent:0,Others:0};
  Object.entries(v).forEach(([k,val])=>{const c=canonicalCashHead(k); if(Object.prototype.hasOwnProperty.call(out,c)) out[c]+=Number(val)||0;});
  return out;
}
function cashHeadBalance(head,date=today()){
  const h=canonicalCashHead(head); let total=0;
  (cashbookEntries||[]).filter(e=>e.entry_date<=date).forEach(e=>{
    if(e.entry_type==='RECEIPT') total+=Number(getAlloc(e)[h]||0);
    else if(e.entry_type==='PAYMENT' && canonicalCashHead(e.code_head)===h) total-=Number(e.amount||0);
  });
  return total;
}
function cashBalanceAsOf(date=today()){
  let cash=0,bank=0;
  (cashbookEntries||[]).filter(e=>e.entry_date<=date).forEach(e=>{
    const a=Number(e.amount)||0;
    if(e.entry_type==='RECEIPT'){if(e.mode==='CASH')cash+=a; else if(e.mode==='BANK')bank+=a;}
    else if(e.entry_type==='PAYMENT'){if(e.mode==='CASH')cash-=a; else if(e.mode==='BANK')bank-=a;}
    else if(e.entry_type==='CASH_DRAWN'){cash+=a;bank-=a;}
  });
  return {cash,bank};
}

  const rows=(cashbookEntries||[]).filter(e=>e.entry_type==='CASH_DRAWN').slice().sort((a,b)=>String(b.entry_date).localeCompare(String(a.entry_date))||String(b.created_at||'').localeCompare(String(a.created_at||''))).slice(0,8);

function updatePaymentBalancePreview(){
  const mode=document.getElementById('cashPaymentMode')?.value||'CASH';
  const head=canonicalCashHead(document.getElementById('cashPaymentCodeHead')?.value||'');
  const date=document.getElementById('payDate')?.value||today();

  const headBal=head?cashHeadBalance(head,date):0;
  const raw=String(document.getElementById('cashPaymentAmount')?.value||'').replace(/[^0-9.]/g,'');
  const amt=Number(raw)||0;

  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=money(v)};
  set('payCashCurrent',cash);set('payBankCurrent',bank);set('payHeadCurrent',headBal);set('payCashBankAfter',mode==='CASH'?afterCash:afterBank);set('payBankAfter',afterBank);set('payHeadAfter',headBal-amt);
  ['payCashBankAfter','payBankAfter','payHeadAfter'].forEach(id=>{const el=document.getElementById(id);if(!el)return;const n=Number(String(el.textContent).replace(/[^0-9.-]/g,''));el.classList.toggle('balance-good',n>=0);el.classList.toggle('balance-bad',n<0)});
  const srcType=document.getElementById('cashSourceType')?.value||''; const srcId=document.getElementById('cashSource')?.value||'';
  const src=(srcType&&srcId)?availablePaymentSources(srcType).find(x=>String(x.id)===String(srcId)):null;
  const note=document.getElementById('paymentBalanceNote'); if(note)note.textContent=`Cash in Hand: ${money(cash)} | Bank Balance: ${money(bank)} | ${head||'Head'} Balance: ${money(headBal)}${src?' | Source Remaining: '+money(src.amount):''}`;
  updateCashDrawnPreview();
}

async function saveCashbook(){

    return window._origSaveCashbookV5.apply(this,arguments);
  }
  if(!canAccountsEntry())return setMsg('paymentMsg','Cash Book entry is restricted to ACCOUNTS and ADMIN.');

  const date=document.getElementById('payDate').value||today();
  const voucher=document.getElementById('payVoucherNo').value.trim();
  const head=canonicalCashHead(document.getElementById('cashPaymentCodeHead').value||'');
  const sourceType=document.getElementById('cashSourceType').value||'';
  const sourceId=['MESSING_RV','INCIDENTAL_RV','POL_DRAWN'].includes(sourceType)?(document.getElementById('cashSource').value||null):null;
  const ref=document.getElementById('cashInvoice').value.trim();
  const party=document.getElementById('cashPaymentParty').value.trim();
  const amt=Number(String(document.getElementById('cashPaymentAmount').value||'').replace(/[^0-9.]/g,''))||0;
  const mode=document.getElementById('cashPaymentMode').value||'CASH';
  const narr=document.getElementById('cashPaymentNarration').value.trim();
  if(!voucher||!date||!head||amt<=0)return setMsg('paymentMsg','Enter Date, PV No., Code Head and valid amount.');
  if(['MESSING','INC','POL'].includes(head)&&!sourceId)return setMsg('paymentMsg','Select the linked source invoice / voucher.');
  if(['MESSING','INC','POL'].includes(head)&&sourceId){
    const src=availablePaymentSources(sourceType).find(x=>String(x.id)===String(sourceId));
    if(!src)return setMsg('paymentMsg','Selected source is no longer available. Refresh and select again.');

  if(!['MESSING','INC','POL'].includes(head)&&(ref===''||party===''))return setMsg('paymentMsg','Enter Invoice/Reference and To Whom Paid for this account head.');

  if(error)return setMsg('paymentMsg',error.message);
  setMsg('paymentMsg','Payment voucher saved successfully.',true); clearCashbookForm(); await refreshAll(); updatePaymentBalancePreview();

<script id="ims-v7-stable-data-repair">
/* NCC IMS V7 - stable data loading + compatibility repair */
(() => {
  if (window.__NCC_IMS_V7__) return;
  window.__NCC_IMS_V7__ = true;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const role = () => profile?.role || 'VIEWER';

  const msg = (id, text, ok=false) => { try { setMsg(id,text,ok); } catch(e) { const el=document.getElementById(id); if(el){el.textContent=text;el.style.display='block';} } };

  async function q(table, queryFn){
    try { return await queryFn(sb.from(table)); }
    catch(e){ return {data:null,error:e}; }
  }

  function parseJSON(v, fallback={}){ if(v==null) return fallback; if(typeof v==='object') return v; try{return JSON.parse(v)}catch(_){return fallback} }
  function moneyV(v){ try{return money(v)}catch(_){return '₹'+Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})} }
  function canonicalHeadV(h){
    const k=String(h||'').trim().toUpperCase();
    return ({'MESSING':'Messing','INC':'INC','POL':'POL','RANK PAY':'Rank Pay','TA CADETS':'TA Cadets','TA/DA CIV':'TA/DA Civ Staff','TA/DA CIV STAFF':'TA/DA Civ Staff','TA DA CIV STAFF':'TA/DA Civ Staff','RENT':'Rent','OTHER':'Others','OTHERS':'Others'})[k] || String(h||'').trim();
  }
  const HEADS=['Messing','INC','POL','Rank Pay','TA Cadets','TA/DA Civ Staff','Rent','Others'];

  function getAllocV(e){
    const raw=parseJSON(e?.head_allocations,{}), out={Messing:0,INC:0,POL:0,'Rank Pay':0,'TA Cadets':0,'TA/DA Civ Staff':0,Rent:0,Others:0};
    Object.entries(raw||{}).forEach(([k,v])=>{const c=canonicalHeadV(k); if(c in out) out[c]+=Number(v)||0});
    return out;
  }

  function sourceDetailsV(e){
    const d=parseJSON(e?.source_details,{});
    const items=Array.isArray(d.items)?d.items:[];
    return {...d,to_whom_paid:d.to_whom_paid||e?.party||'',on_account:d.on_account||e?.code_head||e?.reference_no||'',source_reference:d.source_reference||e?.reference_no||'',items};
  }

  function computeBalancesV(date=today()){
    let cash=0, bank=0; const heads={}; HEADS.forEach(h=>heads[h]=0);
    (cashbookEntries||[]).filter(e=>String(e.entry_date||'')<=String(date)).forEach(e=>{
      const a=Number(e.amount)||0;
      if(e.entry_type==='RECEIPT'){ if(e.mode==='BANK') bank+=a; else cash+=a; const al=getAllocV(e); HEADS.forEach(h=>heads[h]+=al[h]); }
      else if(e.entry_type==='PAYMENT'){ if(e.mode==='BANK') bank-=a; else cash-=a; const h=canonicalHeadV(e.code_head); if(h in heads) heads[h]-=a; }
      else if(e.entry_type==='CASH_DRAWN'){ cash+=a; bank-=a; }
    });
    return {cash,bank,heads};
  }

  function safeSetValue(id,v){const e=document.getElementById(id);if(e)e.value=v==null?'':v}
  function safeSetText(id,v){const e=document.getElementById(id);if(e)e.textContent=v}

      q('pol_drawn_entries',x=>x.select('*').eq('camp_id',camp).order('entry_date',{ascending:false}).order('created_at',{ascending:false})),
      q('incidental_vouchers',x=>x.select('*').eq('camp_id',camp).order('voucher_date',{ascending:false}).order('created_at',{ascending:false})),
      q('cashbook_entries',x=>x.select('*').eq('camp_id',camp).order('entry_date',{ascending:false}).order('created_at',{ascending:false})),
      q('cashbook_day_closures',x=>x.select('*').eq('camp_id',camp).order('close_date',{ascending:false}),
      ),
      q('pol_car_diary',x=>x.select('*').eq('camp_id',camp).order('entry_date',{ascending:false}).order('created_at',{ascending:false})),
      q('pol_vehicle_detachments',x=>x.select('*').eq('camp_id',camp).order('detachment_date',{ascending:false}).order('created_at',{ascending:false}))
    ]);
    const [ri,rh,rii,oh,oi,rp,ls,rv,pv,iv,cb,cc,cd,vd]=results;

<script id="ims-v13-pol-detachment-fix">
(function(){
  const n=v=>Number(v||0)||0;
  const normNo=v=>String(v||'').trim().toUpperCase().replace(/\s+/g,'');
  const setv=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v==null?'':v};
  const msg=(id,t,ok=false)=>{try{setMsg(id,t,ok)}catch(_){const e=document.getElementById(id);if(e){e.textContent=t;e.style.display='block'}}};
  async function getVehicleHistoryV13(v,toDate){
    if(!activeCamp||!sb||!v)return {draws:[],diaries:[]};
    const from=String(v.attached_from||''),to=String(toDate||today()),vehicleNo=normNo(v.vehicle_no);
    const [dr,di]=await Promise.all([
      sb.from('pol_drawn_entries').select('*').eq('camp_id',activeCamp.id),
      sb.from('pol_car_diary').select('*').eq('camp_id',activeCamp.id)
    ]);
    if(dr.error)console.warn('V13 POL history',dr.error);
    if(di.error)console.warn('V13 diary history',di.error);
    const same=x=>String(x.vehicle_id||'')===String(v.id)||normNo(x.vehicle_no)===vehicleNo;
    const within=x=>{if(!same(x))return false;const d=String(x.entry_date||x.draw_date||'');return !d||((!from||d>=from)&&(!to||d<=to));};
    const draws=(dr.data||[]).filter(within).sort((a,b)=>String(a.entry_date||'').localeCompare(String(b.entry_date||''))||String(a.created_at||'').localeCompare(String(b.created_at||'')));
    const diaries=(di.data||[]).filter(within).sort((a,b)=>String(a.entry_date||'').localeCompare(String(b.entry_date||''))||String(a.created_at||'').localeCompare(String(b.created_at||'')));
    return {draws,diaries};
  }
  function attachmentBaselineTankV13(v,draws,diaries){
    const raw=v?.initial_tank_balance;
    if(raw!==null&&raw!==undefined&&raw!=='')return n(raw);
    const stored=n(v?.pol_balance);
    if(!draws.length)return stored+diaries.reduce((s,x)=>s+n(x.pol_consumed),0);
    const first=draws[0];
    const firstPrev=(first.previous_fuel!==undefined&&first.previous_fuel!==null&&first.previous_fuel!=='')?n(first.previous_fuel):null;
    if(firstPrev!==null){
      const firstDate=String(first.entry_date||first.draw_date||'');
      const consumedBefore=diaries.filter(x=>String(x.entry_date||'')<firstDate).reduce((s,x)=>s+n(x.pol_consumed),0);
      return Math.max(0,firstPrev+consumedBefore);
    }
    const drawn=draws.reduce((s,x)=>s+n(x.litres),0),consumed=diaries.reduce((s,x)=>s+n(x.pol_consumed),0);
    return Math.max(0,stored+drawn-consumed);
  }

    const {draws,diaries}=await getVehicleHistoryV13(v,toDate);
    const drawn=draws.reduce((s,x)=>s+n(x.litres),0),consumed=diaries.reduce((s,x)=>s+n(x.pol_consumed),0),kmRun=diaries.reduce((s,x)=>s+n(x.km_run),0);
    const opening=n(v.initial_km_reading??v.km_reading),kpl=n(v.kpl),closing=diaries.length?n(diaries[diaries.length-1].closing_km):opening+kmRun;
    const baseTank=attachmentBaselineTankV13(v,draws,diaries),tank=Math.max(0,baseTank+drawn-consumed);

  }

    }catch(e){console.error(e);msg('detMsg','Unable to fetch POL/Car Diary history.');}
  }
  async function saveVehicleDetachmentV13(){
    if(!canQsecEntry())return msg('detMsg','No entry permission for this role.');if(!activeCamp)return msg('detMsg','Select an active camp first.');
    const id=document.getElementById('detVehSelect')?.value||'',to=document.getElementById('detAttachedTo')?.value||'',v=(window.polVehicles||[]).find(x=>String(x.id)===String(id));
    if(!v||!to)return msg('detMsg','Select vehicle and Attached To date.');
    const s=await detStateV13(v,to),payload={camp_id:activeCamp.id,vehicle_id:v.id,vehicle_type:v.vehicle_type||'',vehicle_no:v.vehicle_no||'',unit:v.unit||'',attached_from:v.attached_from||null,attached_to:to,opening_km:s.opening,km_run_camp:s.kmRun,closing_km:s.closing,kpl:s.kpl,pol_consumed:s.consumed,pol_drawn_total:s.drawn,tank_balance:s.tank,created_by:currentUser.id};

  }
  window.loadVehicleDetachment=loadVehicleDetachmentV13;window.saveVehicleDetachment=saveVehicleDetachmentV13;
  const oldSetPOL=window.setPOLTab;window.setPOLTab=function(tab){const r=oldSetPOL?oldSetPOL(tab):undefined;setTimeout(()=>{if(tab==='detach')loadVehicleDetachmentV13()},150);return r};
  document.addEventListener('change',e=>{if(e.target?.id==='detVehSelect'||e.target?.id==='detAttachedTo')loadVehicleDetachmentV13()});
  window.addEventListener('load',()=>setTimeout(loadVehicleDetachmentV13,500));setTimeout(loadVehicleDetachmentV13,800);
})();
</script>


<script id="ims-v14-detachment-final-fix">
(function(){
  function num(v){ return Number(v||0)||0; }
  function norm(v){ return String(v||'').trim().toUpperCase().replace(/\s+/g,''); }
  function setv(id,v){ var e=document.getElementById(id); if(e) e.value=(v==null?'':v); }
  function escv(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function syncVehicleOptions(){
    var s=document.getElementById('detVehSelect');
    if(!s || typeof polVehicles==='undefined') return;
    var current=s.value;
    var html='<option value="">Select Vehicle</option>';
    (polVehicles||[]).forEach(function(v){
      html+='<option value="'+escv(v.id)+'">'+escv(v.vehicle_no||'')+' - '+escv(v.vehicle_type||'')+'</option>';
    });
    s.innerHTML=html;
    if((polVehicles||[]).some(function(v){return String(v.id)===String(current);} )) s.value=current;
  }

  async function fetchHistory(v,toDate){
    if(!activeCamp || !sb || !v) return {draws:[],diaries:[]};
    var from=String(v.attached_from||''), to=String(toDate||today());
    var vehicleId=String(v.id||''), vehicleNo=norm(v.vehicle_no);
    var results=await Promise.all([
      sb.from('pol_drawn_entries').select('*').eq('camp_id',activeCamp.id),
      sb.from('pol_car_diary').select('*').eq('camp_id',activeCamp.id)
    ]);
    var drawsData=(results[0]&&results[0].data)||[];
    var diaryData=(results[1]&&results[1].data)||[];
    function same(x){ return String(x.vehicle_id||'')===vehicleId || norm(x.vehicle_no)===vehicleNo; }
    function inRange(x){
      if(!same(x)) return false;
      var d=String(x.entry_date||x.draw_date||'');
      return !d || ((!from||d>=from)&&(!to||d<=to));
    }
    var draws=drawsData.filter(inRange).sort(function(a,b){return String(a.entry_date||a.draw_date||'').localeCompare(String(b.entry_date||b.draw_date||'')) || String(a.created_at||'').localeCompare(String(b.created_at||''));});
    var diaries=diaryData.filter(inRange).sort(function(a,b){return String(a.entry_date||'').localeCompare(String(b.entry_date||'')) || String(a.created_at||'').localeCompare(String(b.created_at||''));});
    return {draws:draws,diaries:diaries};
  }

  function baseTank(v,draws,diaries){
    var raw=v.initial_tank_balance;
    if(raw!==undefined && raw!==null && raw!=='') return num(raw);
    var stored=num(v.pol_balance);
    if(!draws.length) return Math.max(0,stored+diaries.reduce(function(s,x){return s+num(x.pol_consumed);},0));
    var first=draws[0];
    if(first.previous_fuel!==undefined && first.previous_fuel!==null && first.previous_fuel!==''){
      var fd=String(first.entry_date||first.draw_date||'');
      var preConsumed=diaries.filter(function(x){return String(x.entry_date||'')<fd;}).reduce(function(s,x){return s+num(x.pol_consumed);},0);
      return Math.max(0,num(first.previous_fuel)+preConsumed);
    }
    var drawn=draws.reduce(function(s,x){return s+num(x.litres);},0);
    var consumed=diaries.reduce(function(s,x){return s+num(x.pol_consumed);},0);
    return Math.max(0,stored+drawn-consumed);
  }

  async function calcDetachment(){
    syncVehicleOptions();
    var select=document.getElementById('detVehSelect');
    var id=select?select.value:'';
    var list=(typeof polVehicles!=='undefined')?polVehicles:[];
    var v=list.find(function(x){return String(x.id)===String(id);});
    if(!v){
      ['detVehType','detUnit','detAttachedFrom','detOpeningKm','detKmRun','detClosingKm','detKpl','detPolConsumed','detPolDrawn','detTankBalance'].forEach(function(k){setv(k,'');});
      return;
    }
    try{
      var dateEl=document.getElementById('detAttachedTo');
      var to=dateEl&&dateEl.value?dateEl.value:today();
      var h=await fetchHistory(v,to);
      var drawn=h.draws.reduce(function(s,x){return s+num(x.litres);},0);
      var consumed=h.diaries.reduce(function(s,x){return s+num(x.pol_consumed);},0);
      var kmRun=h.diaries.reduce(function(s,x){return s+num(x.km_run);},0);
      var opening=num(v.initial_km_reading!=null?v.initial_km_reading:v.km_reading);
      var kpl=num(v.kpl);
      var last=h.diaries.length?h.diaries[h.diaries.length-1]:null;
      var closing=last?num(last.closing_km):opening+kmRun;
      var tank=Math.max(0,baseTank(v,h.draws,h.diaries)+drawn-consumed);
      setv('detVehType',v.vehicle_type||'');
      setv('detUnit',v.unit||'');
      setv('detAttachedFrom',v.attached_from||'');
      setv('detOpeningKm',opening.toFixed(1));
      setv('detKmRun',kmRun.toFixed(1));
      setv('detClosingKm',closing.toFixed(1));
      setv('detKpl',kpl.toFixed(2));
      setv('detPolConsumed',consumed.toFixed(2));
      setv('detPolDrawn',drawn.toFixed(2));
      setv('detTankBalance',tank.toFixed(2));
    }catch(e){
      console.error(e);
      var m=document.getElementById('detMsg');
      if(m){m.textContent='Unable to fetch vehicle POL history.';m.style.display='block';}
    }
  }

  window.loadVehicleDetachment=calcDetachment;
  document.addEventListener('change',function(e){
    if(e.target && (e.target.id==='detVehSelect'||e.target.id==='detAttachedTo')) calcDetachment();
  });
  var prevSet=window.setPOLTab;
  if(prevSet) window.setPOLTab=function(tab){var r=prevSet.apply(this,arguments);if(tab==='detach')setTimeout(function(){syncVehicleOptions();calcDetachment();},100);return r;};
  window.addEventListener('load',function(){setTimeout(function(){syncVehicleOptions();calcDetachment();},700);});
})();
</script>
